<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
<g>
<!-- 蓝色大圆 -->
<circle stroke="#00c0ff" fill="none" stroke-width="40" cx="200" cy="200" r="100" />
<!-- 蓝色斜线 -->
<line stroke="#00c0ff" fill="none" stroke-width="40" x1="100" y1="100" x2="300" y2="300" />
<!-- 绿色旋转虚线环 -->
<circle cx="200" cy="200" r="115"
fill="none"
stroke="#00FF00"
stroke-width="10"
stroke-linecap="round"
stroke-dasharray="150 75">
<animateTransform attributeName="transform"
type="rotate"
from="0 200 200"
to="360 200 200"
dur="1.2s"
repeatCount="indefinite" />
</circle>
</g>
</svg>
