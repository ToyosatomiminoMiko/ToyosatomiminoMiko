<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="200" height="200">
<defs>
<style>
.scene {
width: 100%;
height: 100%;
display: flex;
justify-content: center;
align-items: center;
}
.cube {
width: 100px;
height: 100px;
position: relative;
transform-style: preserve-3d;
animation: spin 8s linear infinite;
}
.face {
position: absolute;
width: 100px;
height: 100px;
border: 2px solid #fff;
opacity: 0.85;
backface-visibility: visible;
}
.front  { background: rgba(255,0,0,0.7); transform: translateZ(50px); }
.back   { background: rgba(0,255,0,0.7); transform: rotateY(180deg) translateZ(50px); }
.left   { background: rgba(0,0,255,0.7); transform: rotateY(-90deg) translateZ(50px); }
.right  { background: rgba(255,255,0,0.7); transform: rotateY(90deg) translateZ(50px); }
.top    { background: rgba(0,255,255,0.7); transform: rotateX(90deg) translateZ(50px); }
.bottom { background: rgba(255,0,255,0.7); transform: rotateX(-90deg) translateZ(50px); }

@keyframes spin {
0%   { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
}
</style>
</defs>

<foreignObject x="0" y="0" width="400" height="400">
<div xmlns="http://www.w3.org/1999/xhtml" class="scene">
<div class="cube">
<div class="face front"></div>
<div class="face back"></div>
<div class="face left"></div>
<div class="face right"></div>
<div class="face top"></div>
<div class="face bottom"></div>
</div>
</div>
</foreignObject>
</svg>
